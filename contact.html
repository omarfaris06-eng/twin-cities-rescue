<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Twin Cities Animal Rescue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="rescue-logo_c.png" alt="Twin Cities Animal Rescue Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Get Involved</h1>
        <p>Fill out the form below to inquire about volunteering, fostering, or adopting.</p>

        <form id="rescueContactForm" action="#" method="POST">
            <fieldset>
                <legend>Volunteer or Foster Interest Form</legend>

                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName">
                <span id="nameError" class="error-msg"></span>

                <label for="emailAddress">Email Address:</label>
                <input type="email" id="emailAddress" name="emailAddress">
                <span id="emailError" class="error-msg"></span>

                <label for="interestType">Interest Type:</label>
                <select id="interestType" name="interestType">
                    <option value="volunteer">Volunteer</option>
                    <option value="foster">Foster</option>
                    <option value="adoption">Adoption Info</option>
                </select>

                <label for="message">Short Message:</label>
                <textarea id="message" name="message" rows="4"></textarea>

                <input type="submit" value="Submit Application">
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Twin Cities Animal Rescue. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
